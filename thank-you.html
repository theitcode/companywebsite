<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | THE IT CODE</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Century Gothic';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .thank-you-container {
            max-width: 600px;
            padding: 80px 40px;
            border-radius: 12px;
            border: 1px solid #ccc
        }

        h1 {
            font-size: 1.3rem;
            margin: 20px 0;
        }

        p {
            color: #000000;
            line-height: 1.7;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

    .brand-logo-lockup {
        align-items: center;
        justify-content: center;
        margin-bottom: 50px;
    }

        .back-btn {
            display: inline-block;
            font-size: 0.8rem;
            padding: 12px 30px;
            background-color: whitesmoke;
            color: #000000;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .back-btn:hover {
            background: #000000;
            color: #ffffff;
        }

    </style>
</head>
<body>
    <div class="thank-you-container">

        <div class="brand-logo-lockup">
    <div class="animated-code-tag">
        <span class="tag-part tag-open">&lt;</span><span class="tag-part tag-slash">/</span><span class="tag-part tag-close">&gt;</span>
    </div>
    <!-- Static Brand Text -->
    <h2 class="brand-title">THE IT CODE</h2>
    <span class="brand-tagline">INNOVATE.BUILD.SCALE</span>
</div>
